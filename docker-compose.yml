services:
  llm:
    image: ollama/ollama:0.40.10
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ./models/ollama:/root/.ollama
    gpus: all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      LLM_BASE_URL: http://llm:11434/v1
      MODELS_DIR: /models
    volumes:
      - ./models:/models
    gpus: all
    depends_on:
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 10

  web:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Only on localhost for local testing; the public entry point is cloudflared.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      bot:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    profiles: ["tunnel"]
