# Local TTS sidecars (tts/CONTRACT.md), off unless their profile is enabled (COMPOSE_PROFILES=espeech ...).
include:
  - tts/espeech/compose.yaml

services:
  llm:
    # The host's own Ollama install (Arch, /usr/local) mounted into a tiny base image:
    # the official ollama/ollama image is 8 GB.
    image: ubuntu:24.04
    command: ["/usr/local/bin/ollama", "serve"]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /ollama/models
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # 8k is plenty for a phone call and keeps the KV cache at ~0.3 GB instead of 1.3 GB (32k default).
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ${OLLAMA_BIN:-/usr/local/bin/ollama}:/usr/local/bin/ollama:ro
      - ${OLLAMA_LIB:-/usr/local/lib/ollama}:/usr/local/lib/ollama:ro
      - ${OLLAMA_HOST_DIR:-./models/ollama}:/ollama
      # TLS roots for `ollama pull` (the base image has none).
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    gpus: all
    healthcheck:
      test: ["CMD", "/usr/local/bin/ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      LLM_BASE_URL: http://llm:11434/v1
      MODELS_DIR: /models
    volumes:
      - ${MODELS_HOST_DIR:-./models}:/models
    gpus: all
    depends_on:
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 10

  web:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Only on localhost for local testing; the public entry point is cloudflared.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      bot:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    profiles: ["tunnel"]
